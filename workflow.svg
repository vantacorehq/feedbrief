<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Sequence of one feedbrief check: fetch the feed, skip posted links, summarize with Gemini, post to Telegram, save state, wait" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
    <marker id="res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8ab96"/></marker>
  </defs>
  <rect width="1200" height="740" rx="16" fill="#121110"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="#ff7a1a"/>
  <text x="60" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f2e9d8">One check, step by step</text>
  <rect x="55" y="86" width="190" height="42" rx="8" fill="#1b1916" stroke="#5a5144" stroke-width="2"/>
  <text x="150" y="113" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#f2e9d8">RSS feed</text>
  <line x1="150" y1="130" x2="150" y2="716" stroke="#34302a" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="375" y="86" width="190" height="42" rx="8" fill="#1b1916" stroke="#ff7a1a" stroke-width="2"/>
  <text x="470" y="113" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#f2e9d8">feedbrief</text>
  <line x1="470" y1="130" x2="470" y2="716" stroke="#34302a" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="705" y="86" width="190" height="42" rx="8" fill="#1b1916" stroke="#5a5144" stroke-width="2"/>
  <text x="800" y="113" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#f2e9d8">Gemini API</text>
  <line x1="800" y1="130" x2="800" y2="716" stroke="#34302a" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="965" y="86" width="190" height="42" rx="8" fill="#1b1916" stroke="#5a5144" stroke-width="2"/>
  <text x="1060" y="113" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#f2e9d8">Telegram</text>
  <line x1="1060" y1="130" x2="1060" y2="716" stroke="#34302a" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="464" y1="184" x2="158" y2="184" stroke="#ff7a1a" stroke-width="2.5" marker-end="url(#req)"/>
  <text x="310.0" y="174" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">1</tspan>  GET the feed (timeout 15 s)</text>
  <line x1="156" y1="240" x2="462" y2="240" stroke="#b8ab96" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#res)"/>
  <text x="310.0" y="230" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">2</tspan>  RSS or Atom XML</text>
  <rect x="490" y="268" width="290" height="84" rx="8" fill="#1b1916" stroke="#ff7a1a"/>
  <text x="504" y="294" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">3</tspan>  Skip links already posted,</text>
  <text x="504" y="316" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8">take the oldest first,</text>
  <text x="504" y="338" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8">at most --max-per-check</text>
  <line x1="476" y1="396" x2="792" y2="396" stroke="#ff7a1a" stroke-width="2.5" marker-end="url(#req)"/>
  <text x="635.0" y="386" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">4</tspan>  title + description</text>
  <line x1="794" y1="450" x2="478" y2="450" stroke="#b8ab96" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#res)"/>
  <text x="635.0" y="440" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">5</tspan>  2-3 sentence summary</text>
  <text x="640" y="478" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a6f5e">if Gemini fails: the feed description is used instead</text>
  <line x1="476" y1="540" x2="1052" y2="540" stroke="#ff7a1a" stroke-width="2.5" marker-end="url(#req)"/>
  <text x="765.0" y="530" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">6</tspan>  sendMessage (HTML escaped, max 4096 chars)</text>
  <line x1="1054" y1="596" x2="478" y2="596" stroke="#b8ab96" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#res)"/>
  <text x="765.0" y="586" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">7</tspan>  200 OK: the link is saved to state.json</text>
  <text x="765" y="626" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a6f5e">HTTP 429: wait retry_after. Other errors: try again next check, give up after 3 failures</text>
  <rect x="490" y="650" width="330" height="62" rx="8" fill="#1b1916" stroke="#ff7a1a"/>
  <text x="504" y="676" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8"><tspan fill="#ff7a1a" font-weight="700">8</tspan>  Wait --interval seconds,</text>
  <text x="504" y="698" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f2e9d8">then start again</text>
</svg>
