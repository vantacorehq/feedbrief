<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Example dry run in the terminal and how the posts look in Telegram (made-up articles)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="560" rx="16" fill="#121110"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="#ff7a1a"/>
  <text x="60" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f2e9d8">What a run looks like</text>
  <rect x="400" y="34" width="420" height="28" rx="14" fill="none" stroke="#ffd166"/>
  <text x="610" y="53" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffd166">example data: made-up feed and articles</text>

  <!-- terminal -->
  <rect x="40" y="90" width="590" height="430" rx="12" fill="#0c0b0a" stroke="#34302a"/>
  <rect x="40" y="90" width="590" height="34" rx="12" fill="#1b1916"/>
  <rect x="40" y="112" width="590" height="12" fill="#1b1916"/>
  <circle cx="64" cy="107" r="5" fill="#5a5144"/>
  <circle cx="82" cy="107" r="5" fill="#5a5144"/>
  <circle cx="100" cy="107" r="5" fill="#5a5144"/>
  <text x="330" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a6f5e">dry run: nothing is posted</text>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" xml:space="preserve">
    <text x="60" y="154" fill="#f2e9d8"><tspan fill="#ff7a1a">$</tspan> python feedbrief.py run --once --dry-run --no-ai \</text>
    <text x="60" y="174" fill="#f2e9d8">      --feed https://example.org/feed</text>
    <text x="60" y="206" fill="#b8ab96">Watching 1 feed(s), one check (dry run: nothing is</text>
    <text x="60" y="226" fill="#b8ab96">posted). Data folder: data</text>
    <text x="60" y="256" fill="#b8ab96">[21:36:38] https://example.org/feed: 2 articles in</text>
    <text x="60" y="276" fill="#b8ab96">the feed, 2 new.</text>
    <text x="60" y="306" fill="#ffb066">[dry-run] would post:</text>
    <text x="60" y="326" fill="#f2e9d8">&lt;b&gt;Example network upgrade goes live&lt;/b&gt;</text>
    <text x="60" y="356" fill="#b8ab96">The example network completed its planned upgrade.</text>
    <text x="60" y="386" fill="#b8ab96">https://example.org/news/1</text>
    <text x="60" y="426" fill="#ffb066">[dry-run] would post:</text>
    <text x="60" y="446" fill="#f2e9d8">&lt;b&gt;Example exchange adds new listing&lt;/b&gt;</text>
    <text x="60" y="476" fill="#b8ab96">An example exchange said it will list a new token</text>
    <text x="60" y="496" fill="#b8ab96">next week &amp;amp; update its fee table. ...</text>
  </g>

  <!-- telegram chat -->
  <rect x="670" y="90" width="490" height="430" rx="12" fill="#0f161c" stroke="#34505f"/>
  <rect x="670" y="90" width="490" height="44" rx="12" fill="#1a2630"/>
  <rect x="670" y="120" width="490" height="14" fill="#1a2630"/>
  <circle cx="702" cy="112" r="14" fill="#ff7a1a"/>
  <text x="702" y="117" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#121110">f</text>
  <text x="728" y="108" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2e9d8">Example channel</text>
  <text x="728" y="125" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a96a8">posts from feedbrief</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="690" y="156" width="430" height="150" rx="14" fill="#1f2a33"/>
    <text x="710" y="188" font-size="16" font-weight="700" fill="#f2e9d8">Example network upgrade goes live</text>
    <text x="710" y="216" font-size="14" fill="#cfc6b6">The example network completed its planned</text>
    <text x="710" y="236" font-size="14" fill="#cfc6b6">upgrade. (In a real run Gemini writes a 2-3</text>
    <text x="710" y="256" font-size="14" fill="#cfc6b6">sentence summary here.)</text>
    <text x="710" y="288" font-size="14" fill="#ffb066">https://example.org/news/1</text>

    <rect x="690" y="326" width="430" height="150" rx="14" fill="#1f2a33"/>
    <text x="710" y="358" font-size="16" font-weight="700" fill="#f2e9d8">Example exchange adds new listing</text>
    <text x="710" y="386" font-size="14" fill="#cfc6b6">An example exchange said it will list a new</text>
    <text x="710" y="406" font-size="14" fill="#cfc6b6">token next week &amp; update its fee table.</text>
    <text x="710" y="458" font-size="14" fill="#ffb066">https://example.org/news/2</text>
  </g>
  <text x="915" y="502" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a6f5e">mock-up of a Telegram chat, not a real screenshot</text>
</svg>
