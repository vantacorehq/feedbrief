<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="feedbrief: long RSS articles go in, short Telegram posts written by Gemini come out" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#121110"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="#ff7a1a"/>

  <text x="60" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#f2e9d8">feedbrief</text>
  <text x="60" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#ffb066">Long articles in, short posts out.</text>
  <text x="60" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#b8ab96">Reads RSS and Atom feeds, asks Gemini for a 2-3 sentence summary,</text>
  <text x="60" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#b8ab96">posts it to Telegram and remembers which links it already posted.</text>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#f2e9d8">
    <rect x="60" y="278" width="128" height="34" rx="17" fill="none" stroke="#5a5144"/>
    <text x="124" y="300" text-anchor="middle">RSS + Atom</text>
    <rect x="200" y="278" width="100" height="34" rx="17" fill="none" stroke="#5a5144"/>
    <text x="250" y="300" text-anchor="middle">Gemini</text>
    <rect x="312" y="278" width="116" height="34" rx="17" fill="none" stroke="#5a5144"/>
    <text x="370" y="300" text-anchor="middle">Telegram</text>
  </g>

  <!-- long article card -->
  <g transform="translate(620 52)">
    <rect width="210" height="236" rx="10" fill="#1b1916" stroke="#34302a"/>
    <rect x="18" y="20" width="150" height="14" rx="3" fill="#f2e9d8"/>
    <g fill="#34302a">
      <rect x="18" y="52" width="174" height="8" rx="4"/>
      <rect x="18" y="70" width="168" height="8" rx="4"/>
      <rect x="18" y="88" width="174" height="8" rx="4"/>
      <rect x="18" y="106" width="150" height="8" rx="4"/>
      <rect x="18" y="124" width="172" height="8" rx="4"/>
      <rect x="18" y="142" width="166" height="8" rx="4"/>
      <rect x="18" y="160" width="174" height="8" rx="4"/>
      <rect x="18" y="178" width="140" height="8" rx="4"/>
      <rect x="18" y="196" width="100" height="8" rx="4"/>
    </g>
    <text x="18" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a6f5e">article in the feed (example)</text>
  </g>

  <line x1="842" y1="170" x2="912" y2="170" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="877" y="154" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#ffb066">Gemini</text>

  <!-- telegram bubble -->
  <g transform="translate(926 78)">
    <path d="M18 0 H224 Q242 0 242 18 V148 Q242 166 224 166 H18 Q0 166 0 148 V18 Q0 0 18 0 Z" fill="#1f2a33" stroke="#34505f"/>
    <text x="18" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2e9d8">Example headline</text>
    <text x="18" y="64" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#cfc6b6">A short summary of the</text>
    <text x="18" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#cfc6b6">article in two or three</text>
    <text x="18" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#cfc6b6">sentences.</text>
    <text x="18" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffb066">https://example.org/news/1</text>
  </g>
  <text x="1047" y="272" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a6f5e">Telegram post (example)</text>
</svg>
